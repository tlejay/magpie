<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Magpie — offscreen worker</title>
</head>
<body>
  <!-- Nobody ever sees this page. It exists purely because an MV3 service
       worker gets torn down while idle and cannot hold a MediaStream. -->
  <video id="feed" autoplay muted playsinline></video>
  <audio id="alert" src="../assets/alert.wav" preload="auto"></audio>

  <!-- The three bundles in lib/ total 445 KB and used to be parsed here on
       every capture, whichever tools were armed. offscreen.js pulls in only the
       ones the session needs — see loadLib(). -->
  <script type="module" src="offscreen.js"></script>
</body>
</html>
